name: Keep Render instance warm

# Render's free tier spins the instance down after 15 minutes of inactivity.
# A cold start measured ~27s on 2026-08-24 — long enough that non-technical
# focus-group testers will assume the site is broken and abandon.
#
# This pings /health every 10 minutes during UK waking hours only, which keeps
# the instance warm for testers without burning the private-repo Actions budget:
#   ~90 runs/day x 1 billed minute = ~1,260 minutes over a 14-day test window
#   (free private-repo allowance is 2,000 minutes/month).
#
# Hours are UTC. 7-21 UTC = 07:00-22:00 UK during GMT (set 2026-10-21, ahead of
# clocks going back on 25 Oct). Under BST change to 6-20 to keep the same UK hours.
#
# DISABLE THIS once the focus group is done, or the monthly budget will be spent
# on an app nobody is testing.

on:
  schedule:
    - cron: '*/10 7-21 * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          # --max-time 90 so a genuinely cold instance is woken rather than
          # timing out mid-spin-up (cold start measured ~27s, allow headroom).
          # --retry covers transient Render blips without failing the run.
          curl --fail --silent --show-error \
               --max-time 90 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               --write-out 'status=%{http_code} time=%{time_total}s\n' \
               --output /dev/null \
               https://getkerbside.onrender.com/health
